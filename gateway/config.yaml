model_list:
  - model_name: research-primary
    litellm_params:
      model: os.environ/PRIMARY_MODEL
      api_base: os.environ/PRIMARY_BASE_URL
      api_key: os.environ/PRIMARY_API_KEY
      timeout: 10
      max_retries: 0
    rpm: 30
  - model_name: research-secondary
    litellm_params:
      model: os.environ/SECONDARY_MODEL
      api_base: os.environ/SECONDARY_BASE_URL
      api_key: os.environ/SECONDARY_API_KEY
      timeout: 10
      max_retries: 0
    rpm: 30
router_settings:
  num_retries: 0
  max_fallbacks: 1
  timeout: 25
  disable_cooldowns: true
  fallbacks:
    - research-primary: [research-secondary]
  optional_pre_call_checks: [enforce_model_rate_limits]
litellm_settings:
  num_retries: 0
  request_timeout: 10
  turn_off_message_logging: true
  telemetry: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  store_prompts_in_spend_logs: false
  forward_client_headers_to_llm_api: false
