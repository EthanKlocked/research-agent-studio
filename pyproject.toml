[project]
name = "research-agent-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2", "langsmith==0.14.1", "mcp>=1.12,<2", "python-dotenv>=1,<2", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
